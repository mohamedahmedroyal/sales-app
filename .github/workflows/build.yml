{"name":"Build APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"subosito/flutter-action@v2","with":{"channel":"stable"}},{"name":"Fixed signing key","env":{"KS":"${{ secrets.KEYSTORE_B64 }}"},"run":"mkdir -p ~/.android\nif [ -n \"$KS\" ]; then echo \"$KS\" | base64 -d > ~/.android/debug.keystore; keytool -list -keystore ~/.android/debug.keystore -storepass android | grep androiddebugkey; echo signed-with-fixed-key; else echo NO-FIXED-KEY; fi"},{"name":"Build","run":"mkdir src && unzip app.zip -d src\nflutter create --platforms=android --org com.mohamed --project-name sales_app app\nif [ -f src/prebuild.sh ]; then bash src/prebuild.sh; fi\nsed -i \"s|android:label=\\\"[^\\\"]*\\\"|android:label=\\\"$(cat src/appname.txt)\\\"|\" app/android/app/src/main/AndroidManifest.xml\nif [ -d src/res ]; then cp -r src/res/. app/android/app/src/main/res/; fi\ncp src/pubspec.yaml app/pubspec.yaml\nrm -rf app/lib && cp -r src/lib app/lib\ncd app\nflutter pub get\nflutter build apk --release"},{"uses":"actions/upload-artifact@v4","with":{"name":"MANrep-apk","path":"app/build/app/outputs/flutter-apk/app-release.apk"}}]}}}
